name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # update, not install: the lock file pins one resolution, while this
      # matrix needs whatever set of dev dependencies fits each PHP version.
      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
